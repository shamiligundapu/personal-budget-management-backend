spring.application.name=budget-management

server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=${DB_URL:${DATABASE_URL:${MYSQL_URL:${SPRING_DATASOURCE_URL:}}}}
spring.datasource.username=${DB_USERNAME:${DATABASE_USERNAME:${MYSQL_USER:${SPRING_DATASOURCE_USERNAME:root}}}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:${MYSQL_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.sql.init.mode=never

jwt.secret=${JWT_SECRET:budgetflow-production-secret-key-min-256-bits-long-32-chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized

frontend.url=${FRONTEND_URL:http://localhost:5173}

budget.alert.threshold-percent=${BUDGET_ALERT_THRESHOLD_PERCENT:80}
pricing.currency.code=${CURRENCY_CODE:INR}

ai.api.key=${AI_API_KEY:}
ai.api.url=${AI_API_URL:https://api.openai.com/v1/chat/completions}

logging.level.root=INFO
logging.level.com.budgetmanagement=DEBUG
